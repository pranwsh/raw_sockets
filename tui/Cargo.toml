[package]
name = "msgtui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "reusable ratatui chat TUI frontend (generic over a ChatClient trait)"
# `src/bin/tui_client.rs` is a module of the `msgtui` bin, not its own binary.
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "msgtui"
path = "src/bin/msgtui.rs"

[dependencies]
ratatui = "0.30"
chat-model = { path = "../chat-model" }
hex = "0.4"

# Used only by the `msgtui` binary (src/bin/) to connect to the server; the
# `msgtui` lib itself stays free of any wire knowledge.
msgclient = { path = "../client" }
